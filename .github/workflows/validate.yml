name: Validate

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "25.9.0"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # test/unit/skill-bundles.test.ts asserts the checked-in registry pins
      # against external canonical skill trees under /home/gabriel/... (see
      # approvedSourceRoots in herdr-skill-bundles.json). Those trees do not
      # exist on a CI runner, so this pre-existing failure is excluded by name.
      - run: npx vitest run --exclude 'test/unit/skill-bundles.test.ts'
