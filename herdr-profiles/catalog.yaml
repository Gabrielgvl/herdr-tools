  - herdr-profiles/role-plugins/reviewer/skills/delivery-assurance
  - herdr-profiles/role-plugins/reviewer/skills/oracle
  - herdr-profiles/role-plugins/reviewer/skills/pi-review-pr
  - herdr-profiles/role-plugins/reviewer/skills/ponytail
  - herdr-profiles/role-plugins/reviewer/skills/reviewer
  - herdr-profiles/role-plugins/reviewer/skills/typescript
  - herdr-profiles/role-plugins/scout/skills/scout
  - herdr-profiles/role-plugins/worker/skills/adr
  - herdr-profiles/role-plugins/worker/skills/delivery-assurance
  - herdr-profiles/role-plugins/worker/skills/git-flow
  - herdr-profiles/role-plugins/worker/skills/ponytail
  - herdr-profiles/role-plugins/worker/skills/tdd
  - herdr-profiles/role-plugins/worker/skills/typescript
  - herdr-profiles/role-plugins/worker/skills/worker

# Reviewed plugin roots (Claude `--plugin-dir` units). Claude skill/MCP loading
# is additive on top of ambient config — not isolation.
plugins:
  - herdr-profiles/profile-plugins/executor
  - herdr-profiles/profile-plugins/manager
  - herdr-profiles/role-plugins/planner
  - herdr-profiles/role-plugins/promoter
  - herdr-profiles/role-plugins/researcher
  - herdr-profiles/role-plugins/reviewer
  - herdr-profiles/role-plugins/scout
  - herdr-profiles/role-plugins/worker

# Reviewed MCP servers, keyed by server name with the plugin that provides it.
mcp:
  herdr:
    plugin: herdr-tools
  executor:
    plugin: herdr-executor

runners:
  pi:
    # Per-model declared reasoning axes (ADR-037 audit). GPT-5.6 supports six
    # settings; Pi `minimal` is a runner-level alias of provider `low` and is
    # never a canonical point. GPT-6 Astra has no `off` operating point.
    models:
      - {model: openai-codex/gpt-5.6-luna, supportedReasoning: [off, low, medium, high, xhigh, max]}
      - {model: openai-codex/gpt-5.6-terra, supportedReasoning: [off, low, medium, high, xhigh, max]}
      - {model: openai-codex/gpt-5.6-sol, supportedReasoning: [off, low, medium, high, xhigh, max]}
      - {model: openai-codex/gpt-6-astra, supportedReasoning: [low, medium, high, xhigh, max]}
      # GLM-5.3-Flash routes are billed outside the runner's codex domain:
      # provider + billingProduct keep their availability tuples distinct.
      - {model: zai/glm-5.3-flash, provider: zai, quota: {billingProduct: zai-api}, supportedReasoning: [low, high, max]}
      - {model: opencode-go/glm-5.3-flash, provider: opencode-go, quota: {billingProduct: opencode-go-subscription}, supportedReasoning: [low, high, max]}
    quota:
      provider: openai-codex
      billingProduct: codex
      account: primary
      scope: account
    defaults:
      thinking: high
      timeoutMinutes: 30
      sessionPersistence: true
    plumbing:
      sessionPersistence: optional
      promptDelivery: file
      skillSelection: exact
      toolSelection: allowlist
    pools:
      # Union of every pi profile's tool allowlist, including the Codex adapter
      # surface (the adapter deactivates itself if any owned tool is missing).
      tools:
        - read
        - bash
        - bash_bg
        - grep
        - find
        - ls
        - edit
        - write
        - ask_user_question
        - mcp
        - ffgrep
        - fffind
        - ctx_execute
        - ctx_execute_file
        - ctx_search
        - web_search
        - source_check
        - fetch_content
        - get_search_content
        - executor_execute
        - executor_skills
        - executor_resume
        - herdr_inspect
        - herdr_launch
        - herdr_communicate
        - herdr_wait
        - herdr_jobs
        - herdr_pane
        - herdr_tab
        - jobs
        - job_decide
        - monitor
        - change_reasoning
        - exec_command
        - write_stdin
        - apply_patch
        - exec
        - wait
        - notebook
        - view_image
        - new_context
        - get_context_remaining
        - history
        - notes
      # The reviewed Pi extension set is empty today.
      extensions: []
      skills:
        - herdr-profiles/pi-skills/context-mode
        - herdr-profiles/pi-skills/tmux-background-tasks
        - herdr-profiles/profile-plugins/executor/skills/executor
        - herdr-profiles/profile-plugins/manager/skills/decision-batch
        - herdr-profiles/profile-plugins/manager/skills/delivery-assurance
        - herdr-profiles/profile-plugins/manager/skills/engineering-project-manager
        - herdr-profiles/profile-plugins/manager/skills/harness-flow
        - herdr-profiles/profile-plugins/manager/skills/herdr-manager
        - herdr-profiles/profile-plugins/manager/skills/manager
        - herdr-profiles/profile-plugins/manager/skills/oracle
        - herdr-profiles/profile-plugins/manager/skills/pi-review-pr
        - herdr-profiles/role-plugins/manager/skills/harness-flow
        - herdr-profiles/role-plugins/manager/skills/manager
        - herdr-profiles/role-plugins/planner/skills/adr
        - herdr-profiles/role-plugins/planner/skills/blueprint
        - herdr-profiles/role-plugins/planner/skills/delivery-assurance
        - herdr-profiles/role-plugins/planner/skills/engineering-project-manager
        - herdr-profiles/role-plugins/planner/skills/humanizer
        - herdr-profiles/role-plugins/planner/skills/planner
        - herdr-profiles/role-plugins/planner/skills/ponytail
        - herdr-profiles/role-plugins/planner/skills/ticket-writer
        - herdr-profiles/role-plugins/promoter/skills/authenticated-staging-smoke
        - herdr-profiles/role-plugins/promoter/skills/courier-pr-gates
        - herdr-profiles/role-plugins/promoter/skills/delivery-assurance
        - herdr-profiles/role-plugins/promoter/skills/dev-evidence-gate
        - herdr-profiles/role-plugins/promoter/skills/git-flow
        - herdr-profiles/role-plugins/promoter/skills/promoter
        - herdr-profiles/role-plugins/promoter/skills/release-pr-validation
        - herdr-profiles/role-plugins/promoter/skills/services-ci-gates
        - herdr-profiles/role-plugins/promoter/skills/shared-dev-deploy
        - herdr-profiles/role-plugins/researcher/skills/humanizer
        - herdr-profiles/role-plugins/researcher/skills/researcher
        - herdr-profiles/role-plugins/reviewer/skills/adr
        - herdr-profiles/role-plugins/reviewer/skills/delivery-assurance
        - herdr-profiles/role-plugins/reviewer/skills/oracle
        - herdr-profiles/role-plugins/reviewer/skills/pi-review-pr
        - herdr-profiles/role-plugins/reviewer/skills/ponytail
        - herdr-profiles/role-plugins/reviewer/skills/reviewer
        - herdr-profiles/role-plugins/reviewer/skills/typescript
        - herdr-profiles/role-plugins/scout/skills/scout
        - herdr-profiles/role-plugins/worker/skills/adr
        - herdr-profiles/role-plugins/worker/skills/delivery-assurance
        - herdr-profiles/role-plugins/worker/skills/git-flow
        - herdr-profiles/role-plugins/worker/skills/ponytail
        - herdr-profiles/role-plugins/worker/skills/tdd
        - herdr-profiles/role-plugins/worker/skills/typescript
        - herdr-profiles/role-plugins/worker/skills/worker
      mcp:
        - herdr
        - executor
  claude:
    # Rolling CLI aliases are the deliberate catalog identity (owner decision)
    # so the catalog follows each family. Canonical resolutions as of the
    # 2026-09-21 audit: fable → claude-fable-5-1, opus → claude-opus-5,
    # sonnet → claude-sonnet-5, haiku → claude-haiku-4-5-20251001. Haiku
    # supports no Claude effort — it yields one unreasoned point.
    models:
      - {model: fable, supportedReasoning: [low, medium, high, max]}
      - {model: opus, supportedReasoning: [low, medium, high, max]}
      - {model: sonnet, supportedReasoning: [low, medium, high, max]}
      - {model: haiku}
    quota:
      provider: anthropic
      billingProduct: claude
      account: primary
      scope: account
    defaults:
      effort: high
      permissionMode: dontAsk
      timeoutMinutes: 30
      sessionPersistence: true
    plumbing:
      sessionPersistence: required
      promptDelivery: file
      skillSelection: additive
      toolSelection: allowlist
    pools:
      tools:
        - AskUserQuestion
        - Bash
        - Edit
        - Glob
        - Grep
        - NotebookEdit
        - Read
        - Skill
        - ToolSearch
        - WebFetch
        - WebSearch
        - Write
      plugins:
        - herdr-profiles/profile-plugins/executor
        - herdr-profiles/profile-plugins/manager
        - herdr-profiles/role-plugins/planner
        - herdr-profiles/role-plugins/promoter
        - herdr-profiles/role-plugins/researcher
        - herdr-profiles/role-plugins/reviewer
        - herdr-profiles/role-plugins/scout
        - herdr-profiles/role-plugins/worker
      mcp:
        - herdr
        - executor
  agy:
    # Reasoning is encoded in the model id — one bare point per model.
    models:
      - {model: gemini-3.8-flash-low}
      - {model: gemini-3.8-flash-medium}
      - {model: gemini-3.8-flash-high}
    quota:
      provider: google
      billingProduct: antigravity
      account: primary
      scope: account
    defaults:
      mode: plan
      timeoutMinutes: 30
      sessionPersistence: true
    plumbing:
      sessionPersistence: required
      promptDelivery: bootstrap
      skillSelection: ambient
      toolSelection: ambient
  devin:
    # Specialist tiers plus the audit's benchmarked Fusion pairings; reasoning
    # is model-encoded. The `adaptive` router model is deliberately absent.
    models:
      - {model: swe-2-medium}
      - {model: swe-2-high}
      - {model: swe-2-max}
      - {model: swe-1-7-lightning-medium}
      - {model: swe-1-7-lightning}
      - {model: fusion-claude-fable-5-1-medium-sidekick-swe-2-medium}
      - {model: fusion-claude-fable-5-1-high-sidekick-swe-2-medium}
      - {model: fusion-gpt-6-astra-medium-sidekick-swe-2-medium}
      - {model: fusion-gpt-6-astra-high-sidekick-swe-2-medium}
    quota:
      provider: cognition
      billingProduct: devin
      account: primary
      scope: account
    defaults:
      permissionMode: dangerous
      timeoutMinutes: 30
      sessionPersistence: true
    plumbing:
      sessionPersistence: required
      promptDelivery: none
      skillSelection: ambient
      toolSelection: ambient

# Reviewed operating-point policy (ADR-037) — the FROZEN audited table from
# plan-delta-model-audit v3.1 Appendix A, transcribed verbatim. One entry per
# generated point — each model crossed with its own declared reasoning set —
# keyed by the exact opaque point id; the parser requires this key set to
# equal the generated set, so a missing or unknown id invalidates the
# catalog. Classes derive from the audit's deterministic thresholds: cost on
# list-equivalent output price (≤1.5 low, ≤15 medium, ≤25 high, >25 extreme;
# subscription-included routes keep list-equivalent classes), latency on
# end-to-end or decode evidence with a +1 step above medium reasoning.
# Evidence limitation, recorded per the audit: the OpenCode Go GLM route has
# no independent latency measurement and is classed conservatively high;
# Devin classes rest on published task economics, not wall-clock latency.
pointPolicy:
  pi:openai-codex/gpt-5.6-luna:off: {costClass: low, latencyClass: low}
  pi:openai-codex/gpt-5.6-luna:low: {costClass: low, latencyClass: low}
  pi:openai-codex/gpt-5.6-luna:medium: {costClass: low, latencyClass: low}
  pi:openai-codex/gpt-5.6-luna:high: {costClass: low, latencyClass: medium}
  pi:openai-codex/gpt-5.6-luna:xhigh: {costClass: low, latencyClass: medium}
  pi:openai-codex/gpt-5.6-luna:max: {costClass: low, latencyClass: medium}
  pi:openai-codex/gpt-5.6-terra:off: {costClass: medium, latencyClass: low}
  pi:openai-codex/gpt-5.6-terra:low: {costClass: medium, latencyClass: low}
  pi:openai-codex/gpt-5.6-terra:medium: {costClass: medium, latencyClass: low}
  pi:openai-codex/gpt-5.6-terra:high: {costClass: medium, latencyClass: medium}
  pi:openai-codex/gpt-5.6-terra:xhigh: {costClass: medium, latencyClass: medium}
  pi:openai-codex/gpt-5.6-terra:max: {costClass: medium, latencyClass: medium}
  pi:openai-codex/gpt-5.6-sol:off: {costClass: high, latencyClass: medium}
  pi:openai-codex/gpt-5.6-sol:low: {costClass: high, latencyClass: medium}
  pi:openai-codex/gpt-5.6-sol:medium: {costClass: high, latencyClass: medium}
  pi:openai-codex/gpt-5.6-sol:high: {costClass: high, latencyClass: high}
  pi:openai-codex/gpt-5.6-sol:xhigh: {costClass: high, latencyClass: high}
  pi:openai-codex/gpt-5.6-sol:max: {costClass: high, latencyClass: high}
  pi:openai-codex/gpt-6-astra:low: {costClass: extreme, latencyClass: high}
  pi:openai-codex/gpt-6-astra:medium: {costClass: extreme, latencyClass: high}
  pi:openai-codex/gpt-6-astra:high: {costClass: extreme, latencyClass: extreme}
  pi:openai-codex/gpt-6-astra:xhigh: {costClass: extreme, latencyClass: extreme}
  pi:openai-codex/gpt-6-astra:max: {costClass: extreme, latencyClass: extreme}
  claude:fable:low: {costClass: extreme, latencyClass: high}
  claude:fable:medium: {costClass: extreme, latencyClass: high}
  claude:fable:high: {costClass: extreme, latencyClass: extreme}
  claude:fable:max: {costClass: extreme, latencyClass: extreme}
  claude:opus:low: {costClass: high, latencyClass: medium}
  claude:opus:medium: {costClass: high, latencyClass: medium}
  claude:opus:high: {costClass: high, latencyClass: high}
  claude:opus:max: {costClass: high, latencyClass: high}
  claude:sonnet:low: {costClass: medium, latencyClass: low}
  claude:sonnet:medium: {costClass: medium, latencyClass: low}
  claude:sonnet:high: {costClass: medium, latencyClass: medium}
  claude:sonnet:max: {costClass: medium, latencyClass: medium}
  claude:haiku: {costClass: medium, latencyClass: low}
  agy:gemini-3.8-flash-low: {costClass: medium, latencyClass: medium}
  agy:gemini-3.8-flash-medium: {costClass: medium, latencyClass: medium}
  agy:gemini-3.8-flash-high: {costClass: medium, latencyClass: high}
  pi:zai/glm-5.3-flash:low: {costClass: low, latencyClass: medium}
  pi:zai/glm-5.3-flash:high: {costClass: low, latencyClass: high}
  pi:zai/glm-5.3-flash:max: {costClass: low, latencyClass: high}
  pi:opencode-go/glm-5.3-flash:low: {costClass: low, latencyClass: high}
  pi:opencode-go/glm-5.3-flash:high: {costClass: low, latencyClass: high}
  pi:opencode-go/glm-5.3-flash:max: {costClass: low, latencyClass: high}
  devin:swe-2-medium: {costClass: medium, latencyClass: medium}
  devin:swe-2-high: {costClass: medium, latencyClass: high}
  devin:swe-2-max: {costClass: medium, latencyClass: high}
  devin:swe-1-7-lightning-medium: {costClass: medium, latencyClass: low}
  devin:swe-1-7-lightning: {costClass: medium, latencyClass: low}
  devin:fusion-claude-fable-5-1-medium-sidekick-swe-2-medium: {costClass: extreme, latencyClass: high}
  devin:fusion-claude-fable-5-1-high-sidekick-swe-2-medium: {costClass: extreme, latencyClass: extreme}
  devin:fusion-gpt-6-astra-medium-sidekick-swe-2-medium: {costClass: extreme, latencyClass: high}
  devin:fusion-gpt-6-astra-high-sidekick-swe-2-medium: {costClass: extreme, latencyClass: extreme}

# The reactive classified-failure cooldown floor is mandatory for every runner
# (B2 owns the record). Proactive sources are declared where they exist so B12
# can attach them without changing this schema. Sources stay runner-scoped:
# `pi-quotas` covers only the runner's openai-codex domain — the zai and
# opencode-go model entries have no proactive source in this migration (a
# tracked follow-up keys proactive sources by quota domain).
quotaSources:
  - name: reactive-cooldowns
    kind: floor
  - name: pi-quotas
    kind: proactive
    runner: pi
  - name: claude-account-windows
    kind: proactive
    runner: claude
  - name: devin-analytics
    kind: coarse
    runner: devin
