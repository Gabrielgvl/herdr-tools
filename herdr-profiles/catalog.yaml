# Herdr category catalog (ADR-035). The spec launch path resolves a caller's
# optional `category` into the first eligible, quota-available chain candidate;
# the remainder is the pre-execution fallback. Pools are the reviewed resource
# sets Jev may select from — never a grant by themselves.
version: 1

# ADR-026's ratified four-attempt bound, carried forward as the declared chain
# depth (plan R4). A chain longer than this fails closed; it is never truncated.
maxAttempts: 4

categories:
  frontier:
    - runner: devin
      model: swe-2-max
    - runner: claude
      model: claude-fable-5
    - runner: pi
      model: openai-codex/gpt-6-astra
    - runner: claude
      model: claude-opus-5
  balanced:
    - runner: claude
      model: claude-opus-5
    - runner: pi
      model: openai-codex/gpt-5.6-sol
    - runner: devin
      model: swe-2-max
    - runner: pi
      model: openai-codex/gpt-5.6-luna
  cheap:
    - runner: agy
      model: gemini-3.8-flash-low
    - runner: pi
      model: openai-codex/gpt-5.6-luna
    - runner: claude
      model: claude-sonnet-5
    - runner: agy
      model: gemini-3.8-flash-high

